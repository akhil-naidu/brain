<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Emoji-style brain: soft pink lobes + folds -->
  <defs>
    <linearGradient id="brainFill" x1="8" y1="6" x2="24" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8FA8"/>
      <stop offset="1" stop-color="#F06292"/>
    </linearGradient>
  </defs>

  <!-- Left hemisphere -->
  <path
    fill="url(#brainFill)"
    d="M15.6 7.2
       C13.8 5.1 10.2 5.3 8.6 7.4
       C7.2 9.2 7.4 11.6 8.6 13.2
       C7.1 14.2 6.2 16 6.4 17.9
       C6.7 20.6 8.8 22.5 11.4 22.7
       C12.2 24.6 14 25.8 15.9 25.6
       L15.6 7.2Z"
  />
  <!-- Right hemisphere -->
  <path
    fill="url(#brainFill)"
    d="M16.4 7.2
       C18.2 5.1 21.8 5.3 23.4 7.4
       C24.8 9.2 24.6 11.6 23.4 13.2
       C24.9 14.2 25.8 16 25.6 17.9
       C25.3 20.6 23.2 22.5 20.6 22.7
       C19.8 24.6 18 25.8 16.1 25.6
       L16.4 7.2Z"
  />

  <!-- Center fissure -->
  <path
    stroke="#E91E63"
    stroke-width="1.1"
    stroke-linecap="round"
    opacity="0.55"
    d="M16 7.4 V25.2"
  />

  <!-- Cortical folds (emoji wrinkles) -->
  <path
    stroke="#E91E63"
    stroke-width="1.15"
    stroke-linecap="round"
    opacity="0.45"
    fill="none"
    d="M9.2 9.4 C10.6 9.1 12 9.8 12.8 10.8
       M8.4 12.6 C9.8 12.2 11.4 12.8 12.4 14
       M9 16.2 C10.4 15.8 12 16.5 12.8 17.8
       M10.2 19.6 C11.4 19.3 12.8 20 13.4 21.2
       M22.8 9.4 C21.4 9.1 20 9.8 19.2 10.8
       M23.6 12.6 C22.2 12.2 20.6 12.8 19.6 14
       M23 16.2 C21.6 15.8 20 16.5 19.2 17.8
       M21.8 19.6 C20.6 19.3 19.2 20 18.6 21.2"
  />
</svg>
